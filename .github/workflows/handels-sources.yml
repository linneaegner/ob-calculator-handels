name: Handels sources

on:
  schedule:
    # Jan 1, Apr 1, Jul 1, Oct 1 at 09:00 UTC
    - cron: "0 9 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check Handels source pages
        id: check
        run: |
          set +e
          pnpm check:handels
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Create issue when sources changed
        if: steps.check.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Handels source pages changed — review agreement code"
            const body = [
              "The quarterly Handels source check detected changes on one or more public pages.",
              "",
              "Follow the playbook in `packages/handels/AGENTS.md` to update `packages/handels/` and open a PR.",
              "",
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "- Local check: `pnpm check:handels`",
              "",
              "Configured sources: `packages/handels/sources.json`",
            ].join("\n")

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            })

            if (existing.data.some((issue) => issue.title === title)) {
              core.info("Open issue already exists — skipping duplicate.")
              return
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            })

      - name: Remind to run agent when fetch is blocked
        if: steps.check.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Quarterly Handels check — run agent manually (handels.se blocked from CI)"
            const body = [
              "GitHub Actions could not fetch handels.se (often blocked by Cloudflare from server IPs).",
              "",
              "Run a Cursor agent with web access using the prompt in `packages/handels/AGENTS.md`,",
              "or run `pnpm check:handels` locally and update code if anything changed.",
              "",
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n")

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            })

            if (existing.data.some((issue) => issue.title === title)) {
              core.info("Open issue already exists — skipping duplicate.")
              return
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            })

      - name: Fail job if sources changed
        if: steps.check.outputs.exit_code == '1'
        run: exit 1
